plugins {
    id 'application'
    id 'com.gradleup.shadow'
    id 'io.freefair.lombok'
}

application {
    mainClass = "com.skcraft.launcher.FancyLauncher"
}

repositories {
    maven {
        name = 'bbkr.space mirror'
        url = 'https://alexiil.uk/mirrors/server.bbkr.space/maven-snapshot'
    }
}

dependencies {
    implementation project(path: ':launcher')
    implementation 'io.github.cottonmc.insubstantial:substance:7.3.1-SNAPSHOT'
}

shadowJar {
    dependsOn ':launcher:shadowJar'
}
