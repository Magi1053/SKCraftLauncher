apply from: "${projectDir}/installer/webview2-runtime.gradle"

def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)

def runtimeModules = [
        'java.desktop',
        'java.logging',
        'java.xml',
        'jdk.crypto.ec',
        'jdk.httpserver',
        'jdk.charsets',
        'jdk.unsupported',
        'jdk.zipfs',
]

def runtimeDir = layout.buildDirectory.dir('runtime')
def appImageDir = layout.buildDirectory.dir('app-image')
def windowsAppImageDir = layout.buildDirectory.dir('windows-app-image')
def launcherShadowJar = project(':launcher').tasks.named('shadowJar')
def bootstrapShadowJar = tasks.named('shadowJar')
def deleteFiles = { Object... paths -> project.delete(paths) }
def copyFiles = { Closure spec -> project.copy(spec) }

def splashPng = file("${projectDir}/src/main/resources/com/skcraft/launcher/splash.png")

def hostBrowser = configureHostBrowserRuntime()

def writeIcoFromPng = { File sourcePng, File targetIco ->
    if (!sourcePng.isFile()) {
        throw new GradleException("Launcher icon PNG not found at ${sourcePng}.")
    }

    def image = javax.imageio.ImageIO.read(sourcePng)
    if (image == null) {
        throw new GradleException("Failed to read PNG icon at ${sourcePng}.")
    }

    byte[] pngBytes = sourcePng.bytes
    int width = Math.min(image.width, 256)
    int height = Math.min(image.height, 256)

    targetIco.parentFile.mkdirs()
    targetIco.withOutputStream { out ->
        out.write(0); out.write(0)
        out.write(1); out.write(0)
        out.write(1); out.write(0)
        out.write(width >= 256 ? 0 : width)
        out.write(height >= 256 ? 0 : height)
        out.write(0); out.write(0)
        out.write(1); out.write(0)
        out.write(32); out.write(0)

        int size = pngBytes.length
        out.write(size & 0xFF)
        out.write((size >> 8) & 0xFF)
        out.write((size >> 16) & 0xFF)
        out.write((size >> 24) & 0xFF)

        int offset = 22
        out.write(offset & 0xFF)
        out.write((offset >> 8) & 0xFF)
        out.write((offset >> 16) & 0xFF)
        out.write((offset >> 24) & 0xFF)
        out.write(pngBytes)
    }
}

def jdk17Launcher = project.extensions.getByType(org.gradle.jvm.toolchain.JavaToolchainService).launcherFor {
    languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(17)
}

tasks.register('createRuntimeImage', Exec) {
    def runtimeOutput = runtimeDir.get().asFile

    doFirst {
        def javaHome = jdk17Launcher.get().metadata.installationPath.asFile
        def jmodsDir = new File(javaHome, 'jmods')
        def jlinkExecutable = new File(javaHome, hostOs.contains('win') ? 'bin/jlink.exe' : 'bin/jlink')

        if (!jmodsDir.isDirectory()) {
            throw new GradleException("JDK 17 jmods directory not found at ${jmodsDir}. Install a JDK 17 (not a JRE) to package installers.")
        }
        if (!jlinkExecutable.isFile()) {
            throw new GradleException("jlink executable not found at ${jlinkExecutable}. Install a JDK 17 that includes jlink.")
        }
        deleteFiles(runtimeOutput)

        commandLine jlinkExecutable.absolutePath,
                '--module-path', jmodsDir.absolutePath,
                '--add-modules', runtimeModules.join(','),
                '--strip-debug',
                '--no-man-pages',
                '--no-header-files',
                '--compress=2',
                '--output', runtimeOutput.absolutePath
    }
}

tasks.register('assembleAppImage') {
    dependsOn bootstrapShadowJar, tasks.named('createRuntimeImage'), launcherShadowJar

    doLast {
        def outputDir = appImageDir.get().asFile
        def appDir = new File(outputDir, 'app')
        def runtimeOutputDir = runtimeDir.get().asFile
        def jarFile = bootstrapShadowJar.get().archiveFile.get().asFile
        def launcherJarFile = launcherShadowJar.get().archiveFile.get().asFile
        def launcherJarName = "${System.currentTimeMillis()}.jar"

        deleteFiles(outputDir)
        appDir.mkdirs()

        copyFiles {
            from(runtimeOutputDir)
            into(new File(outputDir, 'runtime'))
        }

        copyFiles {
            from(jarFile)
            into(appDir)
            rename { 'launcher-bootstrap.jar' }
        }

        copyFiles {
            from(splashPng)
            into(appDir)
        }

        def bootstrapDir = new File(outputDir, 'bootstrap')

        copyFiles {
            from(launcherJarFile)
            into(new File(bootstrapDir, 'launcher'))
            rename { launcherJarName }
        }

        if (hostBrowser.stageSwt) {
            copyFiles {
                from(hostBrowser.swtConfiguration)
                into(new File(bootstrapDir, hostBrowser.swtRuntimePath))
                rename { hostBrowser.swtJarFileName }
            }
        }

        File launcherPayloadDir = new File(bootstrapDir, 'launcher')
        new File(launcherPayloadDir, 'launcher.version').text = project.ext.installerVersion

        def commandScript = new File(outputDir, 'launcher-bootstrap.cmd')
        commandScript.text = """@echo off
set SCRIPT_DIR=%~dp0
"%SCRIPT_DIR%runtime\\bin\\java.exe" -splash:"%SCRIPT_DIR%app\\splash.png" -jar "%SCRIPT_DIR%app\\launcher-bootstrap.jar" %*
"""

        def shellScript = new File(outputDir, 'launcher-bootstrap')
        shellScript.text = '''#!/usr/bin/env sh
set -eu
SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
exec "$SCRIPT_DIR/runtime/bin/java" -splash:"$SCRIPT_DIR/app/splash.png" -jar "$SCRIPT_DIR/app/launcher-bootstrap.jar" "$@"
'''
        shellScript.setExecutable(true)
    }
}

tasks.register('createWindowsLauncher', Exec) {
    dependsOn tasks.named('assembleAppImage')

    def stagedAppImageDir = appImageDir
    def iconSourcePng = file("${projectDir}/src/main/resources/com/skcraft/launcher/bootstrapper_icon.png")
    def iconFile = layout.buildDirectory.file('tmp/windows/icon.ico').get().asFile

    inputs.property('packageAppName', project.ext.packageAppNameWindows)
    inputs.property('installerVersion', project.ext.installerVersion)
    inputs.dir(stagedAppImageDir)
    inputs.file(iconSourcePng)
    outputs.dir(windowsAppImageDir.map { it.dir(project.ext.packageAppNameWindows) })

    onlyIf {
        hostOs.contains('win')
    }

    doFirst {
        def appName = project.ext.packageAppNameWindows
        def stagedAppImage = stagedAppImageDir.get().asFile
        def windowsImageOutputDir = windowsAppImageDir.get().asFile
        def javaHome = jdk17Launcher.get().metadata.installationPath.asFile
        def jpackageExecutable = new File(javaHome, 'bin/jpackage.exe')
        if (!jpackageExecutable.isFile()) {
            throw new GradleException("jpackage executable not found at ${jpackageExecutable}. Install a JDK 17 that includes jpackage.")
        }
        writeIcoFromPng(iconSourcePng, iconFile)

        deleteFiles(windowsImageOutputDir)

        commandLine jpackageExecutable.absolutePath,
                '--type', 'app-image',
                '--dest', windowsImageOutputDir.absolutePath,
                '--name', appName,
                '--app-version', project.ext.installerVersion,
                '--vendor', 'SKCraft',
                '--input', new File(stagedAppImage, 'app').absolutePath,
                '--main-jar', 'launcher-bootstrap.jar',
                '--main-class', 'com.skcraft.launcher.Bootstrap',
                '--runtime-image', new File(stagedAppImage, 'runtime').absolutePath,
                '--java-options', '-splash:$APPDIR/splash.png',
                '--icon', iconFile.absolutePath
    }

    doLast {
        def appName = project.ext.packageAppNameWindows
        def stagedAppImage = stagedAppImageDir.get().asFile
        def windowsImageOutputDir = windowsAppImageDir.get().asFile
        def windowsAppDir = new File(windowsImageOutputDir, appName)
        copyFiles {
            from(new File(stagedAppImage, 'app/splash.png'))
            into(new File(windowsAppDir, 'app'))
        }

        def bootstrapDir = new File(windowsAppDir, 'bootstrap')
        copyFiles {
            from(new File(stagedAppImage, 'bootstrap/launcher'))
            into(new File(bootstrapDir, 'launcher'))
        }
        copyFiles {
            from(new File(stagedAppImage, "bootstrap/${hostBrowser.swtRuntimePath}"))
            into(new File(bootstrapDir, hostBrowser.swtRuntimePath))
        }
    }
}
