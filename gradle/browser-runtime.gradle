def webViewVersion = '1.0.11'
def webViewDependency = "ca.weblite:webview:${webViewVersion}"
def webViewRuntimeRoot = 'natives/weblite'
def webViewChecksumResourcePath = 'META-INF/skcraft/weblite-checksums.properties'
def webViewEntries = [
        windows_64   : 'windows_64/webview.dll',
        windows_arm64: 'windows_arm64/webview.dll',
        osx_64       : 'osx_64/libwebview.dylib',
        osx_arm64    : 'osx_arm64/libwebview.dylib',
        linux_64     : 'linux_64/libwebview.so',
        linux_arm64  : 'linux_arm64/libwebview.so',
]

def resolveHostWebViewPlatform = {
    String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    String suffix = (arch.contains('aarch64') || arch.contains('arm64')) ? 'arm64' : '64'

    if (os.contains('win')) {
        return "windows_${suffix}"
    } else if (os.contains('mac') || os.contains('darwin')) {
        return "osx_${suffix}"
    } else if (os.contains('linux')) {
        return "linux_${suffix}"
    }
    throw new GradleException("Unsupported browser host platform: os=${os}, arch=${arch}")
}

def configureWebViewArtifact = { String configurationName ->
    def configuration = configurations.maybeCreate(configurationName)
    configuration.canBeConsumed = false
    configuration.canBeResolved = true
    dependencies.add(configuration.name, webViewDependency) {
        transitive = false
    }
    configuration
}

def sha256Hex = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = stream.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

ext.addWebliteChecksumResource = { String configurationName = 'webliteChecksumArtifact' ->
    def checksumConfiguration = configureWebViewArtifact(configurationName)
    def generatedChecksumsDir = layout.buildDirectory.dir('generated/weblite-checksums')
    def checksumTask = tasks.register('generateWebliteChecksums') {
        inputs.property('webViewVersion', webViewVersion)
        inputs.property('webViewRuntimeRoot', webViewRuntimeRoot)
        inputs.property('webViewEntries', webViewEntries)
        inputs.files(checksumConfiguration)
        outputs.dir(generatedChecksumsDir)

        doLast {
            File artifact = checksumConfiguration.singleFile
            def checksumFile = generatedChecksumsDir.get().file(webViewChecksumResourcePath).asFile
            checksumFile.parentFile.mkdirs()
            checksumFile.withWriter('UTF-8') { writer ->
                writer.writeLine("version=${webViewVersion}")
                writer.writeLine("path=${webViewRuntimeRoot}")
                webViewEntries.each { platform, entry ->
                    File nativeFile = zipTree(artifact).matching { include entry }.singleFile
                    if (!nativeFile.isFile()) {
                        throw new GradleException("Weblite native entry not found: ${entry}")
                    }
                    writer.writeLine("${platform}.entry=${entry}")
                    writer.writeLine("${platform}.sha256=${sha256Hex(nativeFile)}")
                }
            }
        }
    }

    tasks.named('processResources') {
        dependsOn checksumTask
        from(generatedChecksumsDir)
    }
}

class HostBrowserRuntime {
    def webViewConfiguration
    String nativeEntry
    String nativeFileName
    String runtimePath
}

ext.configureHostBrowserRuntime = { String configurationName = 'hostWebliteBundle' ->
    String platform = resolveHostWebViewPlatform()
    String nativeEntry = webViewEntries[platform]
    new HostBrowserRuntime(
            webViewConfiguration: configureWebViewArtifact(configurationName),
            nativeEntry: nativeEntry,
            nativeFileName: new File(nativeEntry).name,
            runtimePath: "${webViewRuntimeRoot}/${webViewVersion}/${platform}")
}

ext.configureLauncherBrowser = {
    dependencies.add('implementation', webViewDependency)
    project.ext.addWebliteChecksumResource()
}
