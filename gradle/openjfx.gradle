ext.openJfxVersion = '17.0.18'

ext.openJfxModules = [
        'javafx-base',
        'javafx-graphics',
        'javafx-controls',
        'javafx-media',
        'javafx-swing',
        'javafx-web',
]

ext.getHostOpenJfxPlatform = {
    String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    if (os.contains('win')) {
        return 'win'
    } else if (os.contains('mac')) {
        return arch.contains('aarch64') || arch.contains('arm64') ? 'mac-aarch64' : 'mac'
    } else {
        return 'linux'
    }
}

ext.openJfxPlatform = ext.getHostOpenJfxPlatform()

ext.addOpenJfxDependencies = { DependencyHandler handler, String configurationName, String platform ->
    ext.openJfxModules.each { module ->
        handler.add(configurationName, "org.openjfx:${module}:${ext.openJfxVersion}:${platform}")
    }
}
