@accentColor=#DB5036
Button.arc=8
Component.arc=8
Component.focusWidth=0
Component.innerFocusWidth=1
ScrollBar.showButtons=true
SplitPane.dividerSize=4
Table.showHorizontalLines=false

# Keep tab underline accent stable whether focus is on the tab or a child input.
TabbedPane.inactiveUnderlineColor=@accentColor

# FlatMac non-editable combos use up+down arrows; keep mac chrome with a single down arrow.
ComboBoxUI=com.skcraft.launcher.swing.LauncherComboBoxUI
