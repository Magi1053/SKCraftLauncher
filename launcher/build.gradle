plugins {
    id 'application'
    id 'java-library'
    id 'com.gradleup.shadow'
    id 'io.freefair.lombok'
}

application {
    mainClass = "com.skcraft.launcher.Launcher"
}

apply from: rootProject.file('gradle/browser-runtime.gradle')

configureLauncherBrowser()

evaluationDependsOn(':window-agent')
def windowAgentJar = project(':window-agent').tasks.named('shadowJar')

// Shadow explodes nested .jar resources; embed as .bin.
def embeddedAgents = [
    'skcraft-window-agent.bin': { windowAgentJar.get().archiveFile.get().asFile },
    'creeperhost-log4jpatcher.bin': file('third-party/Log4jPatcher-1.0.1.jar'),
]

dependencies {
    api 'javax.xml.bind:jaxb-api:2.3.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.13.2.2'
    api 'commons-lang:commons-lang:2.6'
    api 'commons-io:commons-io:1.2'
    api 'com.google.guava:guava:15.0'
    api 'com.beust:jcommander:1.82'
    api 'com.miglayout:miglayout-swing:11.4.3'
    api 'com.google.code.findbugs:jsr305:3.0.2'

    implementation 'com.googlecode.plist:dd-plist:1.23'
    implementation 'net.java.dev.jna:jna-platform:5.11.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.formdev:flatlaf:3.7.1'
}

shadowJar {
    minimize {
        exclude(dependency('com.formdev:flatlaf:.*'))
        exclude(dependency('ca.weblite:webview:.*'))
        exclude(dependency('net.java.dev.jna:jna:.*'))
        exclude(dependency('net.java.dev.jna:jna-platform:.*'))
    }
    exclude 'module-info.class'
    exclude 'windows_*/**'
    exclude 'linux_*/**'
    exclude 'osx_*/**'
}

processResources {
    dependsOn windowAgentJar
    embeddedAgents.each { name, source ->
        from(source) {
            into 'com/skcraft/launcher/agents'
            rename { name }
        }
    }

    def projectVersion = project.version.toString()
    filesMatching('**/*.properties') {
        filter { it.replace('${project.version}', projectVersion) }
    }
}
