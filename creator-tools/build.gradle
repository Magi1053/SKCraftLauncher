plugins {
    id 'application'
    id 'com.gradleup.shadow'
    id 'io.freefair.lombok'
}

version = "2.1.0-SNAPSHOT"

application {
    mainClass = "com.skcraft.launcher.creator.Creator"
}

dependencies {
    implementation project(path: ':launcher-builder')
    implementation 'org.eclipse.jetty:jetty-server:9.3.1.v20150714'
    implementation 'com.jidesoft:jide-oss:3.6.18'
}


processResources {
    def projectVersion = project.version.toString()
    filesMatching('**/*.properties') {
        filter { it.replace('${project.version}', projectVersion) }
    }
}
